<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/lobotomy-chess.css">
    <title>Lobotomy Chess</title>
</head>
<body>
    <p class="text" style="display: none;" id="turn-notifier">White to move</p>
    <div class="overlay">
        <div class="main-box">
            <p class="text title">Notice</p>
            <p class="text main">
                This website contains loud noises as part of the "lobotomised" effect.
                Please consider muting your device if you are in a quiet setting or lowering the volume if you are sensitive.
                <br>
                <br>
                Play the engine in its default (recommended) settings, or its more powerful settings?
            </p>
            <div id="button-container">
                <button class="accept text" id="default">Default</button>
                <button class="accept text" id="boosted">Boosted</button>
            </div>
        </div>
    </div>
    <div id="chess-board"></div>
</body>
</html>
